<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--card:#1c2d24;--ink:#f1eddc;--mute:#a9b8ab;--green:#3fbf86;--red:#ff6b5e;--gold:#f2b73c;--line:#32473b;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:20px 18px 32px}
h1{font-size:2.1rem;line-height:1.1;margin:8px 0 10px}
p{line-height:1.5;color:var(--mute);font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:1.1rem;font-weight:bold;margin-top:14px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;color:var(--mute);margin-bottom:10px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.time{font-weight:bold;color:var(--ink)}.time.low{color:var(--red)}
.q{font-size:1.28rem;line-height:1.35;margin:0 0 16px;color:var(--ink)}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:1.05rem}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 18%,transparent)}
.opt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 18%,transparent)}
.opt:disabled{cursor:default}
.score{font-size:3rem;font-weight:bold;margin:6px 0}
.hidden{display:none}
.cats button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:14px;margin-top:10px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:1.05rem}
.cats small{color:var(--mute)}
.fb{min-height:1.4em;margin:4px 0 0;font-weight:bold;color:var(--ink)}
.card{box-shadow:0 6px 24px rgba(0,0,0,.08)}
.bar i{background:linear-gradient(90deg,var(--gold),var(--green))}
.opt{transition:transform .1s,border-color .15s}.opt:active:not(:disabled){transform:scale(.98)}
.hero{border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#12283f 0%,#33505e 38%,#d4742f 78%,#f2b73c 100%);color:#fff}
.hero .txt{padding:30px 22px 0}
.hero h1{font-size:2.7rem;margin:0 0 10px;color:#fff;letter-spacing:-.5px}
.hero p{color:#ffe9c4;margin:0;font-size:1.1rem}
.baobab{display:block;width:100%;height:auto;margin-top:-4px}
.ground{background:#0f2418;padding:4px 22px 24px;color:#e8e2cc}
.stats{display:flex;gap:20px;margin:0 0 18px;font-size:.9rem}
.stats b{display:block;font-size:1.5rem;color:var(--gold)}
.go{background:var(--gold);color:#1d2b1f;margin-top:0}
.back{background:none;border:0;color:var(--mute);font-size:1rem;padding:6px 0;margin-bottom:4px}
.cats button{align-items:center;justify-content:flex-start;gap:14px;border-left:6px solid var(--c,var(--green));box-shadow:0 3px 12px rgba(0,0,0,.06)}
.cats button:active{transform:scale(.98)}
.cats i{font-style:normal;font-size:1.6rem;width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--c,var(--green)) 22%,transparent)}
.cats span{display:flex;flex-direction:column}
.cats b{font-size:1.1rem}
.row{display:flex;justify-content:space-between;align-items:center}
.row .back{color:var(--ink);font-weight:bold}
:root[data-theme="dark"]{--bg:#14201a;--card:#1c2d24;--ink:#f1eddc;--mute:#a9b8ab;--green:#3fbf86;--red:#ff6b5e;--gold:#f2b73c;--line:#32473b;color-scheme:dark}
.theme{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.2rem;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.playing .theme{display:none}
.hero .txt{padding-right:62px}
@media (max-width:380px){.hero h1{font-size:2.1rem}.stats{gap:12px}.q{font-size:1.15rem}.opt{padding:12px;font-size:1rem}}
@media (min-width:700px){main{max-width:760px;padding-top:36px}.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cats button{margin-top:0}.hero h1{font-size:3.5rem}.q{font-size:1.5rem}.opt{font-size:1.15rem}}
</style>
</head>

</section>

const ALL="Fangaro rehetra", ROUND=10, SEC=15;
const $=id=>document.getElementById(id);
const OK=["Marina!","Tsara!","Tena tsara!","Tena marina!","Tsara be!","Mahay ianao!"],KO=["Diso","Tsy marina","Tsy izany","Mbola tsy marina"];
let sound=true,voice=null;
const pick=a=>a[Math.floor(Math.random()*a.length)];
$("nq").textContent=Object.values(D).reduce((s,a)=>s+a.length,0);$("nc").textContent=Object.keys(D).length;
const mq=window.matchMedia("(prefers-color-scheme: dark)");
function isDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":mq.matches}
function paint(){$("theme").textContent=isDark()?"☀️":"🌙"}
try{const t=localStorage.getItem("qmg:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
paint();
$("theme").onclick=()=>{const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("qmg:theme",t)}catch(e){}paint()};
function pickVoice(){if(!window.speechSynthesis)return;const v=speechSynthesis.getVoices();voice=v.find(x=>/^mg/i.test(x.lang))||v.find(x=>/^id/i.test(x.lang))||v.find(x=>/^fr/i.test(x.lang))||null;}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){if(!sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice){u.voice=voice;u.lang=voice.lang}u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
let list,i,score,timer,left,locked,cur;

function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function best(n){try{return +localStorage.getItem("qmg:"+n)||0}catch(e){return 0}}
function saveBest(n,v){try{localStorage.setItem("qmg:"+n,v)}catch(e){}}
function show(id){document.body.classList.toggle("playing",id==="play");["home","menu","play","end"].forEach(s=>$(s).classList.toggle("hidden",s!==id));}

const C={"Fangaro rehetra":["🎲","#e8a317"],"Jeografia":["🗺️","#1f7a4d"],"Kolontsaina":["🥁","#c8372d"],"Tantara":["👑","#8a5cc2"],"Fahalalana ankapobeny":["💡","#2a7fc1"],"Fanatanjahantena":["⚽","#d4742f"],"Mozika":["🎵","#d6336c"],"Sakafo malagasy":["🍲","#e67e22"],"Lahatsary sy filma":["🎬","#6f42c1"],"Siansa":["🔬","#0b8a8f"],"Frantsay sy Anglisy":["🔤","#3b5bdb"]};
function build(){
  $("cats").innerHTML="";
  [ALL,...Object.keys(D)].forEach(n=>{
    const total=n===ALL?Object.values(D).reduce((s,a)=>s+a.length,0):D[n].length;
    const b=document.createElement("button");
    b.style.setProperty("--c",C[n][1]);b.innerHTML="<i>"+C[n][0]+"</i><span><b>"+n+"</b><small>"+total+" fanontaniana · tsara indrindra: "+best(n)+"</small></span>";
    b.onclick=()=>start(n);
    $("cats").appendChild(b);
  });
}

function start(n){
  cur=n;
  const pool=n===ALL?Object.values(D).flat():D[n];
  list=shuffle(pool).slice(0,ROUND).map(a=>({q:a[0],ok:a[1],o:shuffle(a.slice(1))}));
  i=0;score=0;show("play");ask();
}

function ask(){
  const it=list[i];locked=false;
  $("count").textContent=(i+1)+" / "+list.length;
  $("pts").textContent="Isa: "+score;
  $("bar").style.width=(i/list.length*100)+"%";
  $("q").textContent=it.q;$("fb").textContent="";$("next").classList.add("hidden");
  $("opts").innerHTML="";
  it.o.forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(t);$("opts").appendChild(b);});
  left=SEC;tick();clearInterval(timer);
  timer=setInterval(()=>{left--;tick();if(left<=0)answer(null);},1000);
}
function tick(){$("time").textContent=left+" s";$("time").classList.toggle("low",left<=5);}

function answer(t){
  if(locked)return;locked=true;clearInterval(timer);
  const it=list[i];
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.textContent===it.ok)b.classList.add("ok");else if(b.textContent===t)b.classList.add("bad");});
  if(t===it.ok){const g=10+left,w=pick(OK);score+=g;$("fb").textContent=w+" +"+g;say(w);}
  else{const w=t===null?"Lany ny fotoana":pick(KO);$("fb").textContent=w+". Ny valiny: "+it.ok;say(w);}
  $("pts").textContent="Isa: "+score;
  $("next").textContent=i===list.length-1?"Hijery ny isa":"Manaraka";
  $("next").classList.remove("hidden");$("next").focus();
}
$("next").onclick=()=>{i++;i<list.length?ask():finish();};

function finish(){
  show("end");
  const old=best(cur);
  $("final").textContent=score+" isa";
  let m=score>=old&&score>0?"Rekoa vaovao! ":"Tsara indrindra: "+old+". ";
  if(score>old)saveBest(cur,score);
  const r=score/(ROUND*25);
  m+=r>.7?"Mahay be ianao!":r>.4?"Tsara, mbola afaka mandroso.":"Aza kivy, andramo indray.";
  $("msg").textContent=m;say(r>.7?"Mahay be ianao!":r>.4?"Tsara, mbola afaka mandroso":"Aza kivy, andramo indray");
}
$("again").onclick=()=>start(cur);
$("home2").onclick=()=>{build();show("menu");};
$("go").onclick=()=>{build();show("menu");};
$("back").onclick=()=>show("home");
$("quit").onclick=()=>{clearInterval(timer);if(window.speechSynthesis)speechSynthesis.cancel();build();show("menu");};
$("snd").onclick=()=>{sound=!sound;$("snd").textContent=sound?"🔊":"🔇";if(!sound&&window.speechSynthesis)speechSynthesis.cancel();};
show("home");
</script>
