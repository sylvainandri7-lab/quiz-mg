<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Madagasikara</title>
<style>
:root{--bg:#f3efe4;--card:#fffdf7;--ink:#1d2b1f;--mute:#5d6b5f;--green:#1f7a4d;--red:#c8372d;--gold:#e8a317;--line:#d9d2bd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--card:#1c2d24;--ink:#f1eddc;--mute:#a9b8ab;--green:#3fbf86;--red:#ff6b5e;--gold:#f2b73c;--line:#32473b;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:20px 18px 32px}
h1{font-size:2.1rem;line-height:1.1;margin:8px 0 10px}
p{line-height:1.5;color:var(--mute);font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:1.1rem;font-weight:bold;margin-top:14px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;color:var(--mute);margin-bottom:10px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.time{font-weight:bold;color:var(--ink)}.time.low{color:var(--red)}
.q{font-size:1.28rem;line-height:1.35;margin:0 0 16px;color:var(--ink)}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:1.05rem}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 18%,transparent)}
.opt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 18%,transparent)}
.opt:disabled{cursor:default}
.score{font-size:3rem;font-weight:bold;margin:6px 0}
.hidden{display:none}
.cats button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:14px;margin-top:10px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:1.05rem}
.cats small{color:var(--mute)}
.fb{min-height:1.4em;margin:4px 0 0;font-weight:bold;color:var(--ink)}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>Quiz Madagasikara</h1>
  <p>Fanontaniana 10 isaky ny lalao. Faingana kokoa, isa bebe kokoa. Misafidiha sokajy.</p>
  <div class="cats" id="cats"></div>
</section>
<section id="play" class="hidden">
  <div class="top"><span id="count"></span><span class="time" id="time"></span><span id="pts"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="card">
    <p class="q" id="q"></p>
    <div id="opts"></div>
    <p class="fb" id="fb"></p>
    <button class="btn hidden" id="next">Manaraka</button>
  </div>
</section>
<section id="end" class="hidden">
  <div class="card">
    <h1>Vita!</h1>
    <div class="score" id="final"></div>
    <p id="msg"></p>
    <button class="btn" id="again">Lalao indray</button>
    <button class="btn alt" id="home2">Sokajy hafa</button>
  </div>
</section>
</main>

const ALL="Fangaro rehetra", ROUND=10, SEC=15;
const $=id=>document.getElementById(id);
let list,i,score,timer,left,locked,cur;

function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function best(n){try{return +localStorage.getItem("qmg:"+n)||0}catch(e){return 0}}
function saveBest(n,v){try{localStorage.setItem("qmg:"+n,v)}catch(e){}}
function show(id){["home","play","end"].forEach(s=>$(s).classList.toggle("hidden",s!==id));}

function home(){
  $("cats").innerHTML="";
  [ALL,...Object.keys(D)].forEach(n=>{
    const total=n===ALL?Object.values(D).reduce((s,a)=>s+a.length,0):D[n].length;
    const b=document.createElement("button");
    b.innerHTML="<span>"+n+"</span><small>"+total+" fanontaniana · tsara indrindra: "+best(n)+"</small>";
    b.onclick=()=>start(n);
    $("cats").appendChild(b);
  });
  show("home");
}

function start(n){
  cur=n;
  const pool=n===ALL?Object.values(D).flat():D[n];
  list=shuffle(pool).slice(0,ROUND).map(a=>({q:a[0],ok:a[1],o:shuffle(a.slice(1))}));
  i=0;score=0;show("play");ask();
}

function ask(){
  const it=list[i];locked=false;
  $("count").textContent=(i+1)+" / "+list.length;
  $("pts").textContent="Isa: "+score;
  $("bar").style.width=(i/list.length*100)+"%";
  $("q").textContent=it.q;$("fb").textContent="";$("next").classList.add("hidden");
  $("opts").innerHTML="";
  it.o.forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(t);$("opts").appendChild(b);});
  left=SEC;tick();clearInterval(timer);
  timer=setInterval(()=>{left--;tick();if(left<=0)answer(null);},1000);
}
function tick(){$("time").textContent=left+" s";$("time").classList.toggle("low",left<=5);}

function answer(t){
  if(locked)return;locked=true;clearInterval(timer);
  const it=list[i];
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.textContent===it.ok)b.classList.add("ok");else if(b.textContent===t)b.classList.add("bad");});
  if(t===it.ok){const g=10+left;score+=g;$("fb").textContent="Marina! +"+g;}
  else $("fb").textContent=(t===null?"Lany ny fotoana. ":"Diso. ")+"Ny valiny: "+it.ok;
  $("pts").textContent="Isa: "+score;
  $("next").textContent=i===list.length-1?"Hijery ny isa":"Manaraka";
  $("next").classList.remove("hidden");$("next").focus();
}
$("next").onclick=()=>{i++;i<list.length?ask():finish();};

function finish(){
  show("end");
  const old=best(cur);
  $("final").textContent=score+" isa";
  let m=score>=old&&score>0?"Rekoa vaovao! ":"Tsara indrindra: "+old+". ";
  if(score>old)saveBest(cur,score);
  const r=score/(ROUND*25);
  m+=r>.7?"Mahay be ianao!":r>.4?"Tsara, mbola afaka mandroso.":"Aza kivy, andramo indray.";
  $("msg").textContent=m;
}
$("again").onclick=()=>start(cur);
$("home2").onclick=home;
home();
</script>
